[package]
name = "fs_overlay"
version = "0.2.0"
edition = "2024"

[dependencies]
bitflags = "2.10.0"
itertools = "0.14.0"
linux-raw-sys = "0.12.0"
nix = { version = "0.30.1", features = ["sched", "dir", "fs", "user"] }
rustix = { version = "1.1.2", features = ["mount", "system", "thread"] }
semver = "1.0.27"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0.17"
toml = "0.8"
